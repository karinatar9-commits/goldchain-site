<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מיפוי משימות חינמי · כמה שעות בשבוע אפשר להוריד מכם? | Goldchain AI</title>
<meta name="description" content="2 דקות, 3 צעדים: מסמנים את המשימות הכספיות שנעשות אצלכם ידנית, ורואים כמה שעות בשבוע הן לוקחות ומאילו שלוש כדאי להתחיל.">
<meta property="og:title" content="כמה שעות בשבוע הולכות אצלכם על ניירת?">
<meta property="og:description" content="מיפוי משימות חינמי ב-2 דקות. בלי הרשמה.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://goldchain-ai.com/audit/">
<meta property="og:locale" content="he_IL">
<link rel="canonical" href="https://goldchain-ai.com/audit/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1437'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='700' text-anchor='middle' fill='%23F2B632'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&amp;family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1437;--cobalt:#2340F0;--gold:#F2B632;--bg:#F1F3F8;--ink:#0B1437;--mute:#5A6485;--line:#DDE2EE;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--navy);color:#fff;font-family:"IBM Plex Sans Hebrew",system-ui,sans-serif;min-height:100svh;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--gold);text-decoration:none}
.steps{display:flex;gap:6px}
.steps i{width:34px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);transition:background .3s}
.steps i.on{background:var(--gold)}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(32px,8.4vw,44px);line-height:1.08;margin:8px 0 10px;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
.lead{color:#C7CEE6;font-size:17px;line-height:1.55;margin:0 0 22px;text-wrap:pretty}
.card{background:#fff;color:var(--ink);border-radius:22px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.card h2{font-size:19px;margin:2px 0 4px;font-weight:700}
.card .sub{color:var(--mute);font-size:14.5px;margin:0 0 14px;line-height:1.5}
.task{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:13px 14px;margin:0 0 8px;font-size:16px;color:var(--ink);transition:border-color .15s,background .15s,transform .12s var(--ease)}
.task:active{transform:scale(.985)}
.task .ic{font-size:21px;flex:none}
.task .bx{margin-inline-start:auto;width:24px;height:24px;border-radius:8px;border:2px solid #B9C1D9;flex:none;display:grid;place-items:center;font-size:15px;color:#fff;transition:all .15s}
.task[aria-pressed=true]{border-color:var(--cobalt);background:#EEF1FF}
.task[aria-pressed=true] .bx{background:var(--cobalt);border-color:var(--cobalt)}
.row{padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm{font-weight:600;font-size:16px;margin-bottom:9px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14.5px;color:var(--ink);transition:all .15s}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.bar{position:fixed;inset:auto 0 0 0;background:linear-gradient(rgba(11,20,55,0),var(--navy) 38%);padding:26px 18px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar>div{max-width:560px;width:100%;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:16px;padding:16px 18px;font-size:17px;font-weight:700;background:var(--gold);color:var(--navy);transition:transform .14s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{flex:none;background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.btn.wa{background:#22B45E;color:#fff}
.big{text-align:center;padding:10px 0 4px}
.big .num{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:clamp(84px,24vw,120px);line-height:.95;color:var(--gold);font-variant-numeric:tabular-nums}
.big .unit{font-size:19px;font-weight:600;margin-top:4px}
.big .yr{color:#C7CEE6;font-size:15.5px;margin-top:8px;line-height:1.5}
.meter{height:12px;border-radius:12px;background:rgba(255,255,255,.14);overflow:hidden;margin:18px 0 6px}
.meter b{display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,var(--gold),#F7D98A);transition:width 1.1s var(--ease)}
.mlab{display:flex;justify-content:space-between;color:#9AA4C7;font-size:12.5px;margin-bottom:22px}
.pick{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.pick:last-of-type{border-bottom:0}
.pick .n{flex:none;width:30px;height:30px;border-radius:10px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700}
.pick .t{font-weight:700;font-size:16px}
.pick .h{color:var(--mute);font-size:14.5px;line-height:1.5;margin-top:3px}
.pick .hrs{color:var(--cobalt);font-weight:600;font-size:13.5px;margin-top:4px}
.form{margin-top:16px}
.form label{display:block;font-size:13.5px;color:var(--mute);margin:10px 0 5px}
.form input[type=text],.form input[type=tel]{width:100%;border:2px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;color:var(--ink);background:#fff}
.form input:focus{outline:0;border-color:var(--cobalt)}
.fine{font-size:12.5px;color:var(--mute);line-height:1.5;margin:10px 0 0}
.err{color:#C0392B;font-size:14px;margin-top:8px;min-height:1em}
.note{color:#9AA4C7;font-size:13px;line-height:1.55;margin:16px 4px 0;text-align:center}
.hp{position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);opacity:0}
.view{animation:in .5s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.meter b{transition:none}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">GOLDCHAIN AI</a>
    <div class="steps" aria-hidden="true"><i id="s1" class="on"></i><i id="s2"></i><i id="s3"></i></div>
  </div>
  <main id="app"></main>
</div>
<div class="bar"><div id="bar"></div></div>

<script>
(function(){
  var API='https://tcnnmbmooynevstasgaj.supabase.co/functions/v1/guide-lead';
  var SRC=(new URLSearchParams(location.search).get('src')||'').slice(0,30);
  // ease: 3 = usually quick to take off the owner, 1 = takes longer to set up
  var TASKS=[
    {id:'inv',ic:'🧾',t:'הפקת חשבוניות וקבלות',e:3,how:'הסוכן מכין את החשבונית מתוך ההזמנה או היומן. אתם רק מאשרים בלחיצה.'},
    {id:'col',ic:'💸',t:'גבייה ותזכורות ללקוחות',e:3,how:'תזכורת מנומסת יוצאת לבד לפי ימי האיחור, ואתם רואים בכל רגע מי עדיין חייב.'},
    {id:'sup',ic:'📥',t:'איסוף חשבוניות ספקים לרואה החשבון',e:3,how:'כל חשבונית שמגיעה במייל או בוואטסאפ נקלטת, מתויקת ועוברת לרו"ח מסודרת.'},
    {id:'quo',ic:'📝',t:'הצעות מחיר ומעקב אחריהן',e:3,how:'ההצעה נבנית מהמחירון שלכם, ומי שלא ענה מקבל תזכורת בזמן.'},
    {id:'rep',ic:'📊',t:'דוחות ותמונת מצב: תזרים, מי חייב לי',e:3,how:'כל בוקר מחכה לכם סיכום קצר: מה נכנס, מה יוצא ומה דורש טיפול.'},
    {id:'bank',ic:'🏦',t:'התאמות בנק וכרטיסי אשראי',e:2,how:'הסוכן מצליב תנועות מול חשבוניות ומסמן רק את מה שלא מסתדר.'},
    {id:'pay',ic:'✅',t:'תשלומים לספקים ואישורים',e:2,how:'רשימת תשלומים מוכנה לאישור אחד, עם התראה על כפילות או חריגה.'},
    {id:'sync',ic:'🔁',t:'העתקת נתונים בין מערכות ואקסל',e:2,how:'המערכות מתעדכנות אחת מהשנייה, בלי להקליד את אותו דבר פעמיים.'},
    {id:'qa',ic:'💬',t:'מענה ללקוחות על חשבון, יתרה או תשלום',e:2,how:'שאלות חוזרות נענות מיד מתוך הנתונים שלכם. מה שרגיש עובר אליכם.'},
    {id:'sal',ic:'🕒',t:'שכר, שעות ונוכחות',e:1,how:'השעות נאספות ונבדקות לבד, ומגיעות לחשבת השכר מוכנות.'}
  ];
  var HRS=[{v:.5,l:'חצי שעה'},{v:1,l:'שעה'},{v:2,l:'שעתיים'},{v:4,l:'4 שעות'},{v:7,l:'יותר'}];
  var sel={}, step=1, sent=false;
  var app=document.getElementById('app'), bar=document.getElementById('bar');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function chosen(){return TASKS.filter(function(t){return t.id in sel})}
  function total(){return chosen().reduce(function(a,t){return a+(sel[t.id]||0)},0)}
  function fmt(n){return (Math.round(n*2)/2).toString().replace('.5','½').replace(/^0½$/,'½')}
  function setStep(n){step=n;for(var i=1;i<=3;i++)document.getElementById('s'+i).className=i<=n?'on':'';render();window.scrollTo({top:0})}
  function post(body){try{return fetch(API,{method:'POST',keepalive:true,headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()}).catch(function(){return null})}catch(e){return Promise.resolve(null)}}

  function render(){
    if(step===1){
      app.innerHTML='<div class="view"><h1>כמה שעות בשבוע הולכות אצלכם על <em>ניירת?</em></h1><p class="lead">מיפוי של 2 דקות. מסמנים, ורואים מספר אחד: כמה זמן אפשר להוריד מכם, ומאיפה כדאי להתחיל.</p><div class="card"><h2>מה נעשה אצלכם ידנית?</h2><p class="sub">סמנו כל משימה שמישהו בעסק עושה ביד, שוב ושוב.</p><div id="list"></div></div></div>';
      var list=document.getElementById('list');
      TASKS.forEach(function(t){var b=document.createElement('button');b.type='button';b.className='task';b.setAttribute('aria-pressed',t.id in sel);b.innerHTML='<span class="ic">'+t.ic+'</span><span>'+esc(t.t)+'</span><span class="bx">'+(t.id in sel?'✓':'')+'</span>';
        b.onclick=function(){if(t.id in sel)delete sel[t.id];else sel[t.id]=0;b.setAttribute('aria-pressed',t.id in sel);b.querySelector('.bx').textContent=t.id in sel?'✓':'';bars()};list.appendChild(b)});
    } else if(step===2){
      app.innerHTML='<div class="view"><h1>כמה זמן כל אחת <em>לוקחת?</em></h1><p class="lead">בערך, בשבוע רגיל. של כל מי שמטפל בזה יחד.</p><div class="card" id="rows"></div></div>';
      var rows=document.getElementById('rows');
      chosen().forEach(function(t){var r=document.createElement('div');r.className='row';r.innerHTML='<div class="nm">'+t.ic+' '+esc(t.t)+'</div><div class="chips"></div>';var c=r.querySelector('.chips');
        HRS.forEach(function(h){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=h.l;b.setAttribute('aria-pressed',sel[t.id]===h.v);b.onclick=function(){sel[t.id]=h.v;[].forEach.call(c.children,function(x){x.setAttribute('aria-pressed',x===b)});bars()};c.appendChild(b)});rows.appendChild(r)});
    } else {
      var tot=total(), yr=Math.round(tot*48), days=Math.round(yr/9);
      var top=chosen().slice().sort(function(a,b){return sel[b.id]*b.e-sel[a.id]*a.e}).slice(0,3);
      var pct=Math.min(100,Math.round(tot/45*100));
      app.innerHTML='<div class="view"><div class="big"><div class="num" id="num">0</div><div class="unit">שעות בשבוע על משימות ידניות</div><div class="yr">זה בערך <b>'+yr+' שעות בשנה</b>, כמו '+days+' ימי עבודה מלאים.</div></div><div class="meter"><b id="mb"></b></div><div class="mlab"><span>מד העומס שלכם</span><span>'+pct+'% משבוע עבודה</span></div>'+
        '<div class="card"><h2>מאיפה כדאי להתחיל</h2><p class="sub">שלוש המשימות שלוקחות לכם הכי הרבה זמן ושהכי פשוט להוריד.</p>'+top.map(function(t,i){return '<div class="pick"><div class="n">'+(i+1)+'</div><div><div class="t">'+esc(t.t)+'</div><div class="h">'+esc(t.how)+'</div><div class="hrs">היום: כ-'+fmt(sel[t.id])+' שעות בשבוע</div></div></div>'}).join('')+
        '<div class="form" id="form">'+(sent?'<p class="sub" style="margin:14px 0 0"><b>קיבלנו ✓</b> נחזור אליכם בוואטסאפ עם מפת ההורדה המלאה.</p>':
        '<h2 style="margin-top:14px">רוצים את מפת ההורדה המלאה?</h2><p class="sub">נעבור על המיפוי שלכם ונחזור עם תוכנית: מה יורד ראשון, כמה זמן זה לוקח וכמה זה עולה. בלי התחייבות.</p><label for="nm">שם</label><input id="nm" type="text" autocomplete="name" maxlength="80"><label for="ph">טלפון</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" dir="ltr" style="text-align:right"><input class="hp" id="ws" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="err" id="err" role="alert"></div><p class="fine">בשליחה אתם מאשרים שנחזור אליכם בוואטסאפ או בטלפון לגבי המיפוי. לא נשלח שום דבר אחר.</p>')+'</div></div>'+
        '<p class="note">המספרים מבוססים על ההערכה שסימנתם. במיפוי מלא מודדים אותם בפועל, ורואים כל שבוע כמה ירד.</p></div>';
      var n=document.getElementById('num'), t0=null;
      (function tick(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/900),v=tot*(1-Math.pow(1-p,3));n.textContent=p<1?Math.round(v):fmt(tot);if(p<1)requestAnimationFrame(tick)})(performance.now());
      setTimeout(function(){document.getElementById('mb').style.width=pct+'%'},60);
      post({mode:'audit_done',hours:tot,tasks:chosen().map(function(t){return t.id}),src:SRC});
    }
    bars();
  }
  function summary(){var tot=total();return 'מיפוי משימות: '+fmt(tot)+' שעות בשבוע על משימות ידניות.\n'+chosen().slice().sort(function(a,b){return sel[b.id]-sel[a.id]}).map(function(t){return '• '+t.t+' — '+fmt(sel[t.id])+' ש׳'}).join('\n')}
  function bars(){
    if(step===1){var c=chosen().length;bar.innerHTML='<button class="btn" id="nx" '+(c?'':'disabled')+'>'+(c?'המשך · '+c+' משימות':'סמנו לפחות משימה אחת')+'</button>';document.getElementById('nx').onclick=function(){if(chosen().length)setStep(2)}}
    else if(step===2){var ok=chosen().every(function(t){return sel[t.id]>0});bar.innerHTML='<button class="btn ghost" id="bk">חזרה</button><button class="btn" id="nx" '+(ok?'':'disabled')+'>'+(ok?'להראות לי את המספר':'בחרו זמן לכל משימה')+'</button>';document.getElementById('bk').onclick=function(){setStep(1)};document.getElementById('nx').onclick=function(){if(ok)setStep(3)}}
    else if(sent){bar.innerHTML='<a class="btn wa" style="text-align:center;text-decoration:none" href="https://wa.me/972586352953?text='+encodeURIComponent('היי קרין, עשיתי את מיפוי המשימות באתר.\n'+summary())+'">לדבר איתנו עכשיו בוואטסאפ</a>'}
    else{bar.innerHTML='<button class="btn ghost" id="bk">חזרה</button><button class="btn" id="sd">שלחו לי את המפה</button>';document.getElementById('bk').onclick=function(){setStep(2)};document.getElementById('sd').onclick=send}
  }
  function send(){
    var nm=document.getElementById('nm').value.trim(), ph=document.getElementById('ph').value.trim(), err=document.getElementById('err');
    if(nm.length<2){err.textContent='חסר שם.';document.getElementById('nm').focus();return}
    if(ph.replace(/\D/g,'').length<9){err.textContent='מספר הטלפון לא נראה תקין.';document.getElementById('ph').focus();return}
    var b=document.getElementById('sd');b.disabled=true;b.textContent='שולח…';
    post({mode:'contact',name:nm,phone:ph,need:summary(),consent:true,src:'audit'+(SRC?'-'+SRC:''),website:document.getElementById('ws').value}).then(function(j){
      if(j&&j.ok){sent=true;render()}else{b.disabled=false;b.textContent='שלחו לי את המפה';err.textContent='לא הצלחנו לשלוח. אפשר לנסות שוב, או לכתוב לנו בוואטסאפ: 058-6352953'}
    });
  }
  render();
})();
</script>
</body>
</html>
