      TASKS.forEach(function(t,i){
        var b=document.createElement('button');b.type='button';b.className='tile'+(t.id in sel?' on':'');b.style.animationDelay=(i*45)+'ms';b.setAttribute('aria-pressed',t.id in sel?'true':'false');
        b.innerHTML='<span class="ck">'+(t.id in sel?'✓':'')+'</span><span class="ic">'+t.ic+'</span><span>'+esc(t.t)+'</span>';
        b.addEventListener('click',function(){
          if(t.id in sel)delete sel[t.id];else sel[t.id]=0;var on=t.id in sel;
          b.className='tile'+(on?' on':'');b.style.opacity=1;b.style.animation='none';b.setAttribute('aria-pressed',on?'true':'false');b.firstChild.textContent=on?'✓':'';
          buzz();live(chosen().length,'משימות');bars();
        });
        $('grid').appendChild(b);
      });
    } else if(step===2){
      talk('מעולה. עכשיו <b>בערך כמה זמן בשבוע</b> כל אחת לוקחת? של כל מי שמטפל בזה, ביחד.');
      live(fmt(total()),'שעות בשבוע');
      app.innerHTML='<div id="rows"></div>';
      chosen().forEach(function(t,i){
        var r=document.createElement('div');r.className='trow';r.style.animationDelay=(i*60)+'ms';r.innerHTML='<div class="nm">'+t.ic+' '+esc(t.t)+'</div><div class="chips"></div>';var c=r.lastChild;
        HRS.forEach(function(h){var b=document.createElement('button');b.type='button';b.className='chip'+(sel[t.id]===h.v?' on':'');b.textContent=h.l;
          b.addEventListener('click',function(){sel[t.id]=h.v;for(var k=0;k<c.children.length;k++)c.children[k].className='chip'+(c.children[k]===b?' on':'');buzz();live(fmt(total()),'שעות בשבוע');bars()});c.appendChild(b)});
        $('rows').appendChild(r);
      });
    } else if(step===3){
      orb.className='orb think';talk('שנייה, אני עובר על מה שסימנתם…');
      app.innerHTML='<div class="scan" id="scan"><div><i></i>ממפה את המשימות</div><div><i></i>מחשב שעות בשבוע ובשנה</div><div><i></i>מסדר לפי מה שהכי משתלם להוריד</div></div>';
      bar.innerHTML='';
      var ls=$('scan').children,k=0;ls[0].className='act';
      var iv=setInterval(function(){ls[k].className='done';ls[k].firstChild.textContent='✓';k++;if(k<ls.length)ls[k].className='act';else{clearInterval(iv);setTimeout(function(){step=4;render()},350)}},650);
      return;
    } else if(step===5){
      mapView();
    } else {
      result();
    }
    bars();
  }

  function mapStr(){return chosen().map(function(t){return t.id+':'+plain(sel[t.id])}).join(',')}
  function mapLink(){return 'https://goldchain-ai.com/audit/?m='+mapStr()}
  function taskCard(t){return '<div class="mt"><div class="tt">'+t.ic+' '+esc(t.t)+'<small>'+fh(sel[t.id])+' שע׳ בשבוע</small></div><dl><dt>הסוכן</dt><dd>'+esc(t.how)+'</dd><dt>נשאר אצלכם</dt><dd>'+esc(t.stay)+'</dd><dt>מתחבר ל</dt><dd>'+esc(t.con)+'</dd></dl></div>'}
  function mapView(){
    var tot=total(), all=chosen().slice().sort(function(a,b){return sel[b.id]*b.e-sel[a.id]*a.e});
    var g=[all.slice(0,1),all.slice(1,3),all.slice(3)], names=['שלב 1 · מתחילים כאן','שלב 2 · ממשיכים','שלב 3 · משלימים'], hints=['המשימה שהכי משתלם להוריד ראשונה. בדרך כלל היא עובדת תוך שבוע עד שבועיים.','אחרי שהראשונה רצה, אלה הבאות בתור.','משימות שלוקחות פחות זמן, או שדורשות יותר הכנה.'];
    talk('זו <b>מפת ההורדה</b> שלכם, לפי מה שסימנתם. שמרו את הקישור, אפשר לחזור אליה מתי שרוצים.');
    live(fmt(tot),'שעות בשבוע');
    var h='<div class="maphead"><div class="k">GOLDCHAIN · מפת הורדה</div><h1>'+(mapName?esc(mapName)+', זו המפה שלך':'מפת ההורדה שלכם')+'</h1><p><b>'+fh(tot)+' שעות בשבוע</b> על '+all.length+' משימות ידניות. ככה מורידים אותן:</p></div>';
    g.forEach(function(list,i){if(!list.length)return;var hs=0;list.forEach(function(t){hs+=sel[t.id]});
      h+='<div class="stage s'+(i+1)+'" style="animation-delay:'+(i*160)+'ms"><span class="tag">'+names[i]+'</span><h3>'+fh(hs)+' שעות בשבוע</h3><p class="hint">'+hints[i]+'</p>'+list.map(taskCard).join('')+'</div>'});
    h+='<div class="next"><h3>איך זה מתקדם מכאן</h3><ol><li>שיחת היכרות קצרה: עוברים יחד על המפה ומדייקים את המספרים.</li><li>מחברים את הסוכן למערכות שכבר יש לכם. לא מחליפים שום מערכת.</li><li>המשימה הראשונה עולה לאוויר, וכל מה שיוצא החוצה עובר קודם אישור שלכם.</li><li>כל שבוע מקבלים את מד העומס: כמה שעות ידניות נשארו.</li></ol></div><p class="note">המספרים מבוססים על ההערכה שסימנתם. לוחות הזמנים הם הערכה כללית ומתעדכנים אחרי שיחת ההיכרות.</p>';
    app.innerHTML=h;
  }

  function result(){
    var tot=total(), yr=Math.round(tot*48), days=Math.round(yr/9), pct=Math.min(100,Math.round(tot/45*100));
    var all=chosen().slice().sort(function(a,b){return sel[b.id]*b.e-sel[a.id]*a.e});
    var top=all.slice(0,3), topH=0;top.forEach(function(t){topH+=sel[t.id]});
    talk('הנה התמונה שלכם. עכשיו תראו מה קורה כשאני לוקח את <b>'+(top.length===1?'המשימה הראשונה':top.length+' הראשונות')+'</b> 👇');
    live(fmt(tot),'שעות בשבוע');
    app.innerHTML='<div class="hero"><div class="big" id="big">0</div><div class="u">שעות בשבוע על משימות ידניות</div><div class="y">בערך <b>'+yr+' שעות בשנה</b> · כמו '+days+' ימי עבודה מלאים</div></div>'+
      '<div class="gauge"><b id="gb"></b></div><div class="glab"><span>מד העומס</span><span id="gp">'+pct+'% משבוע עבודה</span></div>'+
      '<div class="flow"><h2>מאיפה מתחילים</h2><p class="sub">לפי הזמן שכל משימה לוקחת וכמה פשוט להוריד אותה.</p><div class="lane"><span>אתם · ידני</span><span>הסוכן · אוטומטי</span></div><div id="jobs">'+
      all.map(function(t,i){return '<div class="job" data-i="'+i+'"><span class="ic">'+t.ic+'</span><div><div class="tt">'+esc(t.t)+'</div><div class="hh">'+fh(sel[t.id])+' שעות בשבוע</div><div class="how">'+esc(t.how)+'</div></div><span class="st">ידני</span></div>'}).join('')+
      '</div><div class="sum" id="sum">'+(top.length===1?'המשימה הזאת היא':'שלוש אלה הן')+' <b>'+fh(topH)+' מתוך '+fh(tot)+' השעות</b> שלכם. מהן הכי כדאי להתחיל.</div></div>'+
      '<div class="form" id="form">'+(sent?'<h2>קיבלנו ✓</h2><p>המפה המלאה שלכם מוכנה.</p>':
      '<h2>קבלו את מפת ההורדה המלאה</h2><p>מפה אישית לפי מה שסימנתם: מה יורד ראשון, מה הסוכן עושה בכל משימה ומה נשאר אצלכם. היא נפתחת מיד, ונשלחת גם למייל.</p><label for="nm">שם</label><input id="nm" type="text" autocomplete="name" maxlength="80"><label for="ph">טלפון</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" dir="ltr" style="text-align:right"><label for="em">מייל (לא חובה, כדי לקבל את המפה גם למייל)</label><input id="em" type="email" inputmode="email" autocomplete="email" maxlength="120" dir="ltr" style="text-align:right"><input class="hp" id="ws" type="text" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="err" id="err" role="alert"></div><p class="fine">בשליחה אתם מאשרים שנשלח לכם את המפה ונחזור אליכם לגבי המיפוי. לא נשלח שום דבר אחר.</p>')+'</div>'+
      '<p class="note">המספרים מבוססים על ההערכה שסימנתם. במיפוי מלא מודדים אותם בפועל, ורואים כל שבוע כמה ירד.</p>';
    var big=$('big'), t0=0;
    function tick(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/1000),v=tot*(1-Math.pow(1-p,3));big.textContent=p<1?Math.round(v):fmt(tot);if(p<1)requestAnimationFrame(tick)}
    requestAnimationFrame(tick);
    setTimeout(function(){$('gb').style.width=pct+'%'},80);
    // the automation moment: top tasks move to the agent lane one by one, and the load meter drops
    if(!result.played){
      result.played=true;
      var jobs=$('jobs').children, left=tot;
      top.forEach(function(t,i){setTimeout(function(){
        var j=jobs[i];if(!j)return;j.className='job auto';j.lastChild.textContent='הסוכן ✓';buzz();
        left-=sel[t.id];var p2=Math.min(100,Math.round(left/45*100));if($('gb'))$('gb').style.width=p2+'%';if($('gp'))$('gp').innerHTML='נשארו '+fh(left)+' שעות ידניות';live(fmt(left),'שעות נשארו');
        if(i===top.length-1)setTimeout(function(){if($('sum'))$('sum').className='sum show'},500);
      },1700+i*900)});
      post({mode:'audit_done',hours:tot,tasks:chosen().map(function(t){return t.id}),src:SRC});
    } else {
      for(var i=0;i<top.length;i++){$('jobs').children[i].className='job auto';$('jobs').children[i].lastChild.textContent='הסוכן ✓'}
      $('sum').className='sum show';
    }
    bars();
  }

  function summary(){var tot=total();return 'מיפוי משימות: '+plain(tot)+' שעות בשבוע על משימות ידניות.\n'+chosen().slice().sort(function(a,b){return sel[b.id]-sel[a.id]}).map(function(t){return '• '+t.t+' — '+plain(sel[t.id])+' ש׳'}).join('\n')}
  function btn(id,cls,txt,dis){return '<button type="button" class="btn '+cls+'" id="'+id+'"'+(dis?' disabled':'')+'>'+txt+'</button>'}
  function bars(){
    if(step===1){var c=chosen().length;bar.innerHTML=btn('nx','',c?'המשך · '+c+' משימות ←':'סמנו לפחות משימה אחת',!c);$('nx').addEventListener('click',function(){if(chosen().length)go(2)})}
    else if(step===2){var ok=chosen().every(function(t){return sel[t.id]>0});bar.innerHTML=btn('bk','ghost','חזרה')+btn('nx','',ok?'תראה לי את המספר ⚡':'בחרו זמן לכל משימה',!ok);$('bk').addEventListener('click',function(){go(1)});$('nx').addEventListener('click',function(){if(ok)go(3)})}
    else if(step===5){
      bar.innerHTML=btn('cp','ghost','העתקת קישור')+'<a class="btn wa" href="https://wa.me/972586352953?text='+encodeURIComponent('היי קרין, קיבלתי את מפת ההורדה ואשמח לשיחת היכרות.\n'+mapLink())+'">לקבוע שיחת היכרות</a>';
      $('cp').addEventListener('click',function(){var b=$('cp');function ok(){b.textContent='הועתק ✓'}try{navigator.clipboard.writeText(mapLink()).then(ok,function(){prompt('הקישור למפה:',mapLink())})}catch(e){prompt('הקישור למפה:',mapLink())}});
    }
    else if(step===4){
      if(sent){bar.innerHTML='<a class="btn wa" href="https://wa.me/972586352953?text='+encodeURIComponent('היי קרין, עשיתי את מיפוי המשימות באתר.\n'+summary())+'">לדבר איתנו עכשיו בוואטסאפ</a>'}
      else{bar.innerHTML=btn('bk','ghost','מחדש')+btn('sd','','לפתוח את המפה שלי ⚡');$('bk').addEventListener('click',function(){result.played=false;go(1)});$('sd').addEventListener('click',send)}
    }
  }
  function send(){
    var nmEl=$('nm'), phEl=$('ph'), err=$('err');
    if(!nmEl){return}
    var nm=nmEl.value.trim(), ph=phEl.value.trim(), em=$('em').value.trim();
    if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){err.textContent='כתובת המייל לא נראית תקינה.';$('em').focus();return}
    if(nm.length<2||ph.replace(/\D/g,'').length<9){err.textContent=nm.length<2?'חסר שם.':'מספר הטלפון לא נראה תקין.';$('form').scrollIntoView({behavior:'smooth',block:'center'});(nm.length<2?nmEl:phEl).focus();return}
    var b=$('sd');b.disabled=true;b.textContent='שולח…';
    post({mode:'contact',name:nm,phone:ph,email:em,map:mapStr(),need:summary(),consent:true,src:'audit'+(SRC?'-'+SRC:''),website:$('ws').value}).then(function(j){
      if(j&&j.ok){sent=true;mapName=nm.split(' ')[0];try{history.replaceState(null,'','?m='+mapStr())}catch(e){}go(5)}else{b.disabled=false;b.textContent='לפתוח את המפה שלי ⚡';err.textContent='לא הצלחנו לשלוח. אפשר לנסות שוב, או לכתוב לנו בוואטסאפ: 058-6352953'}
    });
  }
  try{var m=new URLSearchParams(location.search).get('m')||'';
    if(/^[a-z]+:\d+(\.5)?(,[a-z]+:\d+(\.5)?){0,11}$/.test(m)){m.split(',').forEach(function(x){var a=x.split(':'),h=parseFloat(a[1]);if(TASKS.some(function(t){return t.id===a[0]})&&h>0&&h<=40)sel[a[0]]=h});
      if(chosen().length){sent=true;step=5;for(var i=1;i<=3;i++)$('d'+i).className='on'}}}catch(e){}
  render();
})();
</script>
</body>
</html>
